<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
</head>
<body class="login-page ">

  <!-- SECTION -->
    <section class=" vh-100 ">
    <div class="container-fluid h-100 p-2">
        <div class="row h-100 ">
            
            <div class="col-lg-5 h-100 p-0">
              <div class="login-form w-100">
    <div class="login-inner w-100">
                    <div class="intro mob-textCenter">
                    <img src="images/protonect_logo.png" width="179" alt="protonect logo" class="mob-textCenter">

                    <h2 class="sub-heading pad-top-70 mb-1">Welcome back</h2>
                    <p class="para_text secondarytextcolor m-0 ">Log in to your account to continue.</p>
                    </div>
                    <div class="form-box pb-2">
                        <form>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Email</label>
                                <input type="email" class="form-control" placeholder="Enter your email">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Password</label>
                                <input type="password" class="form-control" placeholder="Enter your password">
                            </div>

                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div>
                                    <input type="checkbox" id="remember" class="form-check-input">
                                    <label for="remember">Remember Me</label>
                                </div>
                                <a href="#" class="forgot-pass fw-semibold">Forgot Password?</a>
                            </div>

                            <label class="form-label fw-semibold">Captcha</label>
                            <div class="captcha-box mb-3">g 4 Y i 1 O Y K</div>

                            <input type="text" class="form-control mb-4" placeholder="Enter Captcha code">

                            <button class="btn btn-primary w-100">Sign in</button>
                        </form>
                    </div>
                   </div>
                </div>
            </div>

            <div class="col-lg-7 h-100 p-0">
            <div class="bg-img h-100"></div>
            </div>

        </div>
    </div>
</section>

   


    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

</body>
</html>
